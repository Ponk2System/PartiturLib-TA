<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="8" />

  <!-- Sheet Music Stave Lines (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="4">
    <line x1="70" y1="170" x2="442" y2="170" />
    <line x1="70" y1="210" x2="442" y2="210" />
    <line x1="70" y1="250" x2="442" y2="250" />
    <line x1="70" y1="290" x2="442" y2="290" />
    <line x1="70" y1="330" x2="442" y2="330" />
  </g>

  <!-- Beamed Eighth Notes (Music Score Icon) -->
  <g fill="url(#goldGrad)" stroke="url(#goldGrad)">
    <!-- Top Beam bar -->
    <polygon points="175,130 365,95 365,145 175,180" />
    
    <!-- Left Stem -->
    <rect x="175" y="145" width="22" height="180" rx="4" />
    <!-- Left Note Head (Rotated Ellipse) -->
    <ellipse cx="155" cy="330" rx="42" ry="30" transform="rotate(-25 155 330)" />

    <!-- Right Stem -->
    <rect x="343" y="110" width="22" height="175" rx="4" />
    <!-- Right Note Head (Rotated Ellipse) -->
    <ellipse cx="323" cy="290" rx="42" ry="30" transform="rotate(-25 323 290)" />
  </g>
</svg>
